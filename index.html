<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>DojoFinder - L'outil d'aide au choix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet (carte) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Font Awesome (icônes) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Ton CSS -->
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="app-container">

    <!-- =======================
         SIDEBAR (FILTRES)
         ======================= -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>DojoFinder</h1>
      </div>

      <div class="sidebar-content">
        <!-- ===== Recherche + Perf ===== -->
        <div class="filter-section">
          <h3>Recherche</h3>
          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              placeholder="Rechercher par ville (IDF)..."
              aria-label="Rechercher par ville"
              autocomplete="off"
            />
            <button
              type="button"
              id="clearSearch"
              class="clear-search-btn"
              aria-label="Effacer la recherche"
            >
              ×
            </button>
          </div>

          <h3>Niveau Sportif</h3>
          <div id="perf-filters" class="button-group">
            <button type="button" class="active" data-perf="all">Tous</button>
            <button type="button" data-perf="Compétition"> Compétition</button>
            <button type="button" data-perf="Loisir"> Loisir</button>
          </div>
        </div>

        <!-- ===== Confort + Géoloc ===== -->
        <div class="filter-section">
          <h3>Confort & Équipements</h3>
          <div class="toggle-group">
            <button type="button" id="toggleDouche" class="toggle-btn"> Douches</button>
            <button type="button" id="toggleHandi" class="toggle-btn">♿ Handiaccès</button>
            <button type="button" id="toggleTribune" class="toggle-btn"> Tribunes</button>

            <!-- ✅ Bouton unique : récupère la position machine et affiche le cercle 2km -->
            <button type="button" id="btnLocateMe" class="toggle-btn">📡 Ma position</button>
          </div>
        </div>

        <!-- ===== Activités ===== -->
        <div class="filter-section">
          <h3>Activités</h3>
          <div id="filters-list" class="button-group">
            <button type="button" class="active" data-filter="">Tous</button>
            <button type="button" data-filter="judo">Judo</button>
            <button type="button" data-filter="karate">Karate</button>
            <button type="button" data-filter="taekwondo">Taekwondo</button>
            <button type="button" data-filter="aikido">Aikido</button>
            <button type="button" data-filter="bjj">BJJ / Jiu-jitsu</button>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="reset-btn">Réinitialiser les filtres</button>
      </div>
    </aside>

    <!-- =======================
         CARTE
         ======================= -->
    <main class="map-wrapper">
      <div id="compteur" class="floating-counter">
        <span class="count-number">-</span> lieux trouvés
      </div>
      <div id="map"></div>
    </main>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    "use strict";

    window.onload = async () => {
      // =======================
      // CONSTANTES / ETAT GLOBAL
      // =======================
      const IDF_REGION_CODE = "11"; // Code région Île-de-France pour filtrer l'API geo.api.gouv.fr
      const DEFAULT_VIEW = { lat: 48.8566, lng: 2.3522, zoom: 11 }; // Vue par défaut (Paris)

      // Ville actuellement sélectionnée via la recherche (null si aucune)
      let currentCity = null;

      // =======================
      // INITIALISATION CARTE LEAFLET
      // =======================
      const map = L.map('map', {
        center: [DEFAULT_VIEW.lat, DEFAULT_VIEW.lng],
        zoom: DEFAULT_VIEW.zoom
      });

      // Fond de carte (Carto)
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // LayerGroup pour (re)dessiner facilement tous les marqueurs à chaque render()
      const layer = L.layerGroup().addTo(map);

      // =======================
      // ETAT DES FILTRES
      // =======================
      let features = [];         // Données GeoJSON chargées (features)
      let filterType = "";       // Activité (judo/karate/...)
      let filterPerf = "all";    // "all" | "Compétition" | "Loisir"
      let filterDouche = false;  // Bool
      let filterHandi = false;   // Bool
      let filterTribune = false; // Bool

      // =======================
      // CERCLE 2 KM (AFFICHÉ AUTOMATIQUEMENT)
      // - S'affiche autour de la ville choisie OU de la position machine
      // =======================
      let radiusCircle = null;

      // Crée le cercle s'il n'existe pas, sinon le déplace / met à jour
      function showOrMoveRadiusCircle(lat, lng, radiusMeters = 2000) {
        const style = {
          radius: radiusMeters,
          color: "#3388ff",
          weight: 2,
          fill: false,        // ✅ transparent (pas de remplissage)
          opacity: 0.9,
          interactive: false  // évite que le cercle "capte" les clics
        };

        if (!radiusCircle) {
          // 1ère création
          radiusCircle = L.circle([lat, lng], style).addTo(map);
        } else {
          // Mise à jour
          radiusCircle.setLatLng([lat, lng]);
          radiusCircle.setRadius(radiusMeters);
          radiusCircle.setStyle(style);
        }
      }

      // Met à jour la position du cercle suivant une priorité :
      // 1) ville sélectionnée (search)
      // 2) position machine (géoloc)
      // 3) centre de la carte
      function updateRadiusCirclePosition() {
        // 1) Cercle sur la ville
        if (currentCity?.centre?.coordinates) {
          const [lon, lat] = currentCity.centre.coordinates; // GeoJSON: [lon, lat]
          showOrMoveRadiusCircle(lat, lon, 2000);
          return;
        }

        // 2) Cercle sur la machine
        if (userLatLng) {
          showOrMoveRadiusCircle(userLatLng.lat, userLatLng.lng, 2000);
          return;
        }

        // 3) Cercle sur le centre de la carte
        const c = map.getCenter();
        showOrMoveRadiusCircle(c.lat, c.lng, 2000);
      }

      // =======================
      // GEOLOC MACHINE (NAVIGATEUR)
      // =======================
      let userLatLng = null; // Stocke la position machine (L.latLng)
      let userMarker = null; // Marqueur "vous êtes ici"

      function locateUser() {
        // Vérifie que le navigateur supporte l'API
        if (!("geolocation" in navigator)) {
          alert("La géolocalisation n'est pas supportée par ce navigateur.");
          return;
        }

        // Récupère une position ponctuelle (pas du suivi continu)
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const accuracy = pos.coords.accuracy; // précision en mètres (approx)

            // Sauvegarde dans une variable globale
            userLatLng = L.latLng(lat, lng);

            // Debug console
            console.log("Coordonnées machine:", lat, lng, "±", Math.round(accuracy), "m");

            // Centre la carte sur l'utilisateur
            map.setView([lat, lng], 15);

            // Crée ou déplace le marqueur utilisateur
            if (!userMarker) {
              userMarker = L.marker([lat, lng]).addTo(map).bindPopup("Vous êtes ici");
            } else {
              userMarker.setLatLng([lat, lng]);
            }

            // ✅ Affiche / met à jour le cercle 2km autour de la machine
            updateRadiusCirclePosition();
          },
          (err) => {
            // Gestion d'erreur: permission refusée, timeout, etc.
            console.error("Erreur géoloc:", err.code, err.message);
            alert("Impossible de récupérer la position (permission refusée ou HTTPS requis).");
          },
          {
            enableHighAccuracy: true, // tente d'être plus précis (peut consommer plus)
            timeout: 10000,           // délai max
            maximumAge: 0             // n'utilise pas un cache trop ancien
          }
        );
      }

      // =======================
      // CHARGEMENT DES DONNÉES GEOJSON
      // =======================
      try {
        const response = await fetch("dojo_finder_final_map.geojson");
        const data = await response.json();
        features = data.features;
        render(); // 1er affichage
      } catch (e) {
        console.error("Erreur chargement GeoJSON:", e);
      }

      // =======================
      // RECENTRAGE SUR UNE VILLE IDF (geo.api.gouv.fr)
      // =======================
      async function centerMapOnCityIDF(cityName, zoom = 13) {
        // Paramètres API pour chercher une commune
        const params = new URLSearchParams({
          nom: cityName,
          boost: "population",
          limit: "20",
          fields: "nom,centre,codeRegion",
        });

        const url = `https://geo.api.gouv.fr/communes?${params.toString()}`;

        const res = await fetch(url, { headers: { Accept: "application/json" } });
        if (!res.ok) throw new Error(`geo.api.gouv.fr HTTP ${res.status}`);

        const communes = await res.json();

        // On prend la 1ère commune IDF qui a un centre (coordonnées)
        const match = communes.find((c) => c.codeRegion === IDF_REGION_CODE && c.centre?.coordinates);
        if (!match) return null;

        // GeoJSON: [lon, lat]
        const [lon, lat] = match.centre.coordinates;

        // Centre la map
        map.setView([lat, lon], zoom);

        // ✅ Affiche / met à jour le cercle 2km autour de la ville
        updateRadiusCirclePosition();

        return match;
      }

      // =======================
      // RENDER: applique les filtres et affiche les marqueurs
      // =======================
      function render() {
        // Vide les anciens marqueurs
        layer.clearLayers();

        let count = 0;

        // Pour chaque feature (dojo)
        features.forEach(f => {
          const p = f.properties;

          // --- 1) FILTRE PERFORMANCE ---
          if (filterPerf !== "all" && p.statut_club !== filterPerf) return;

          // --- 2) FILTRES CONFORT ---
          const hasDouche = p.has_douche || p.equip_douche === "true" || p.equip_douche === true;
          const isHandi = p.inst_acc_handi_bool === "true" || p.inst_acc_handi_bool === true;
          const nbTribunes = parseInt(p.nb_tribunes || p.equip_trib_nb || 0);
          const nbVestiaires = parseInt(p.nb_vestiaires || p.equip_vest_sport || 0);

          if (filterDouche && !hasDouche) return;
          if (filterHandi && !isHandi) return;
          if (filterTribune && nbTribunes <= 0) return;

          // --- 3) FILTRE ACTIVITÉ ---
          const aps = String(p.aps_name || "").toLowerCase();
          if (filterType !== "" && !aps.includes(filterType)) return;

          // Si on arrive ici: la feature passe tous les filtres
          count++;

          // Couleur du marqueur selon compétition / loisir
          const markerColor = p.statut_club === 'Compétition' ? '#fbbf24' : '#3b82f6';

          // Leaflet: geometry GeoJSON = [lon, lat]
          const lat = f.geometry.coordinates[1];
          const lng = f.geometry.coordinates[0];

          // Marqueur cercle
          const marker = L.circleMarker([lat, lng], {
            radius: 9,
            fillColor: markerColor,
            color: "#ffffff",
            weight: 2,
            fillOpacity: 0.9
          });

          // Helper: format distance (gère virgule -> point)
          const fmtDist = (v) => {
            if (v === null || v === undefined || v === "") return "—";
            const n = typeof v === "string" ? Number(v.replace(",", ".")) : Number(v);
            return Number.isFinite(n) ? `${Math.round(n)} m` : "—";
          };

          // Popup HTML (tu peux conserver ton style initial, ici on laisse tel quel)
          const popupHtml = `
            <div class="custom-popup" style="
              min-width:240px;
              max-width:320px;
              font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
              color:#0f172a;
            ">
              <div style="padding:10px 10px 8px 10px;border-bottom:1px solid #e2e8f0;margin-bottom:10px;">
                <div style="display:flex; align-items:flex-start; gap:8px;">
                  <div style="width:10px;height:10px;border-radius:999px;margin-top:5px;background:${markerColor};
                    box-shadow:0 0 0 3px rgba(37,99,235,.08);flex:0 0 auto;"></div>

                  <div style="flex:1 1 auto;">
                    <div style="font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;color:#1e3a8a;">
                      ${p.nom_officiel || p.inst_nom || "—"}
                    </div>
                    <div style="margin-top:4px;font-size:12px;color:#64748b;display:flex;align-items:center;gap:6px;">
                      <i class="fa-solid fa-location-dot"></i>
                      <span>${p.new_name || p.ville || ""}</span>
                    </div>
                  </div>
                </div>
              </div>

              <div style="margin:0 10px 10px 10px;">
                <div style="font-size:11px;color:#475569;text-transform:uppercase;font-weight:800;margin-bottom:6px;">Infrastructures</div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                  <span style="font-size:12px;padding:5px 8px;border-radius:999px;
                    background:${hasDouche ? '#ecfdf5' : '#fef2f2'};
                    border:1px solid ${hasDouche ? '#a7f3d0' : '#fecaca'};
                    color:${hasDouche ? '#065f46' : '#991b1b'};
                    font-weight:700;">
                    ${hasDouche ? '🚿 Douches' : '🚫 Douches'}
                  </span>

                  <span style="font-size:12px;padding:5px 8px;border-radius:999px;background:#f8fafc;border:1px solid #e2e8f0;color:#0f172a;font-weight:700;">
                    👕 ${nbVestiaires} vestiaires
                  </span>

                  <span style="font-size:12px;padding:5px 8px;border-radius:999px;
                    background:${isHandi ? '#eff6ff' : '#f8fafc'};
                    border:1px solid ${isHandi ? '#bfdbfe' : '#e2e8f0'};
                    color:${isHandi ? '#1d4ed8' : '#475569'};
                    font-weight:700;">
                    ${isHandi ? '♿ Accès PMR' : 'PMR: non'}
                  </span>

                  ${nbTribunes > 0 ? `
                    <span style="font-size:12px;padding:5px 8px;border-radius:999px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-weight:700;">
                      🪑 ${nbTribunes} tribunes
                    </span>
                  ` : ''}
                </div>
              </div>

              <div style="margin:0 10px 12px 10px;">
                <div style="font-size:11px;color:#475569;text-transform:uppercase;font-weight:800;margin-bottom:6px;">Transports proches</div>
                <div style="display:grid; gap:8px;">
                  ${[
                    { label:"Bus",  nomField:"arret_bus_nom",   distField:"distance_bus_m",   idField:"arret_bus_id",   icon:"🚌" },
                    { label:"Métro",nomField:"arret_metro_nom", distField:"distance_metro_m", idField:"arret_metro_id", icon:"🚇" },
                    { label:"Tram", nomField:"arret_tram_nom",  distField:"distance_tram_m",  idField:"arret_tram_id",  icon:"🚊" },
                  ].map(t => `
                    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;box-shadow:0 1px 2px rgba(15,23,42,.05);">
                      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                        <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                          <div style="font-size:16px;">${t.icon}</div>
                          <div style="min-width:0;">
                            <div style="font-weight:900;font-size:12px;line-height:1.2;">${t.label}</div>
                            <div style="font-size:12px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                              ${p[t.nomField] ?? "—"}
                            </div>
                          </div>
                        </div>
                        <div style="text-align:right;flex:0 0 auto;">
                          <div style="font-size:10px;color:#64748b;font-weight:700;">Distance</div>
                          <div style="font-weight:900;font-size:13px;">${fmtDist(p[t.distField])}</div>
                        </div>
                      </div>
                      <div style="margin-top:6px;font-size:10px;color:#64748b;">
                        <span style="font-weight:700;">${t.idField}:</span> ${p[t.idField] ?? "—"}
                      </div>
                    </div>
                  `).join("")}
                </div>
              </div>

              ${p.equip_url ? `
                <div style="border-top:1px solid #e2e8f0;padding:10px;text-align:center;">
                  <a href="${p.equip_url}" target="_blank" style="display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#2563eb;color:#fff;text-decoration:none;font-size:12px;font-weight:900;box-shadow:0 6px 18px rgba(37,99,235,.18);">
                    <i class="fa-solid fa-circle-info"></i> Fiche équipement
                  </a>
                </div>
              ` : ''}
            </div>
          `;

          marker.bindPopup(popupHtml).addTo(layer);
        });

        // Mise à jour du compteur en UI
        const compteurEl = document.getElementById("compteur");
        if (compteurEl) {
          compteurEl.innerHTML = `<span class="count-number">${count}</span> lieux trouvés`;
        }
      }

      // =======================
      // EVENTS UI
      // =======================

      // Recherche ville: on centre sur la ville et on rerender
      document.getElementById('searchInput').addEventListener('input', async (e) => {
        const cityName = e.target.value.trim();
        if (!cityName) return;

        // Sauvegarde la ville comme ville active
        currentCity = await centerMapOnCityIDF(cityName);

        // Rafraîchit les marqueurs selon filtres
        render();
      });

      // Clear recherche: remet tout "comme au début"
      document.getElementById('clearSearch').addEventListener('click', () => {
        document.getElementById('searchInput').value = "";
        currentCity = null;

        map.setView([DEFAULT_VIEW.lat, DEFAULT_VIEW.lng], DEFAULT_VIEW.zoom);
        render();

        // Repositionne le cercle (centre carte ou position machine si dispo)
        updateRadiusCirclePosition();
      });

      // Filtres perf
      document.querySelectorAll('#perf-filters button').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('#perf-filters button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filterPerf = btn.dataset.perf;
          render();
        };
      });

      // Filtres activité
      document.querySelectorAll('#filters-list button').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('#filters-list button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filterType = btn.dataset.filter;
          render();
        };
      });

      // Toggles confort
      document.getElementById('toggleDouche').onclick = function() {
        filterDouche = !filterDouche;
        this.classList.toggle('active', filterDouche);
        render();
      };
      document.getElementById('toggleHandi').onclick = function() {
        filterHandi = !filterHandi;
        this.classList.toggle('active', filterHandi);
        render();
      };
      document.getElementById('toggleTribune').onclick = function() {
        filterTribune = !filterTribune;
        this.classList.toggle('active', filterTribune);
        render();
      };

      // Bouton "Ma position": vide la ville et récupère la géoloc
      document.getElementById('btnLocateMe').onclick = function () {
        // On retire la référence à une ville pour forcer "position machine"
        currentCity = null;
        document.getElementById('searchInput').value = "";

        locateUser();
      };

      // Reset global (reload page)
      document.querySelector(".reset-btn").onclick = () => {
        location.reload();
      };
    };
  </script>
</body>
</html>
