<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>DojoFinder - L'outil d'aide au choix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="app-container">

    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>DojoFinder</h1>
      </div>

      <div class="sidebar-content">
        
        <div class="filter-section">
          <h3>Niveau Sportif</h3>
          <div id="perf-filters" class="button-group">
            <button type="button" class="active" data-perf="all">Tous</button>
            <button type="button" data-perf="Compétition"> Compétition</button>
            <button type="button" data-perf="Loisir"> Loisir</button>
          </div>
        </div>

        <div class="filter-section">
          <h3>Confort & Équipements</h3>
          <div class="toggle-group">
            <button type="button" id="toggleDouche" class="toggle-btn"> Douches</button>
            <button type="button" id="toggleHandi" class="toggle-btn">♿ Handiaccès</button>
            <button type="button" id="toggleTribune" class="toggle-btn"> Tribunes</button>
          </div>
        </div>

        <div class="filter-section">
          <h3>Activités</h3>
          <div id="filters-list" class="button-group">
            <button type="button" class="active" data-filter="">Tous</button>
            <button type="button" data-filter="judo">Judo</button>
            <button type="button" data-filter="karate">Karate</button>
            <button type="button" data-filter="taekwondo">Taekwondo</button>
            <button type="button" data-filter="aikido">Aikido</button>
            <button type="button" data-filter="bjj">BJJ / Jiu-jitsu</button>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="reset-btn">Réinitialiser les filtres</button>
      </div>
    </aside>

    <main class="map-wrapper">
      <div id="compteur" class="floating-counter">
        <span class="count-number">-</span> lieux trouvés
      </div>
      <div id="map"></div>
    </main>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    "use strict";

    window.onload = async () => {
      // INITIALISATION CARTE
      const map = L.map('map', { center: [48.8566, 2.3522], zoom: 11 });
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      const layer = L.layerGroup().addTo(map);

      // ÉTAT DES FILTRES
      let features = [];
      let filterType = "";      // Activité
      let filterPerf = "all";   // Niveau Sportif
      let filterDouche = false; // Confort
      let filterHandi = false;  // Confort
      let filterTribune = false;// Confort

      // CHARGEMENT DATA
      try {
        const response = await fetch("dojo_finder_final_map.geojson");
        const data = await response.json();
        features = data.features;
        render();
      } catch (e) {
        console.error("Erreur chargement GeoJSON:", e);
      }
function render() {
  layer.clearLayers();
  let count = 0;

  features.forEach(f => {
    const p = f.properties;

    // --- 1. FILTRE PERFORMANCE ---
    // filterPerf peut être "all", "Compétition" ou "Loisir"
    if (filterPerf !== "all" && p.statut_club !== filterPerf) return;

    // --- 2. FILTRE CONFORT ---
    // On vérifie les booléens et les chaines "true" issues du GeoJSON
    const hasDouche = p.has_douche || p.equip_douche === "true" || p.equip_douche === true;
    const isHandi = p.inst_acc_handi_bool === "true" || p.inst_acc_handi_bool === true;
    const nbTribunes = parseInt(p.nb_tribunes || p.equip_trib_nb || 0);
    const nbVestiaires = parseInt(p.nb_vestiaires || p.equip_vest_sport || 0);

    if (filterDouche && !hasDouche) return;
    if (filterHandi && !isHandi) return;
    if (filterTribune && nbTribunes <= 0) return;

    // --- 3. FILTRE ACTIVITÉ ---
    const aps = String(p.aps_name || "").toLowerCase();
    if (filterType !== "" && !aps.includes(filterType)) return;

    count++;
    
    // --- STYLE DU MARQUEUR ---
    // Or pour compétition, Bleu pour loisir
    const markerColor = p.statut_club === 'Compétition' ? '#fbbf24' : '#3b82f6';
    const marker = L.circleMarker([f.geometry.coordinates[1], f.geometry.coordinates[0]], {
      radius: 9,
      fillColor: markerColor,
      color: "#ffffff",
      weight: 2,
      fillOpacity: 0.9
    });

    // --- POPUP STRUCTURÉE (Cahier des charges) ---
    const popupHtml = `
      <div class="custom-popup" style="min-width:220px; font-family: sans-serif;">
        <div style="margin-bottom:8px;">
          <strong style="font-size:14px; color:#1e3a8a; text-transform:uppercase;">
            ${p.nom_officiel || p.inst_nom}
          </strong><br>
          <small style="color:#64748b;"><i class="fa-solid fa-location-dot"></i> ${p.new_name || p.ville || ""}</small>
        </div>

        <div style="background:#f1f5f9; padding:8px; border-radius:6px; margin-bottom:10px; border-left:4px solid ${markerColor};">
          <b style="font-size:11px; color:#475569; text-transform:uppercase;">Niveau Sportif</b><br>
          <span style="font-weight:bold;">${p.statut_club === 'Compétition' ? ' Compétition' : ' Loisir'}</span>
          ${p.score_global > 0 ? `<br><b style="color:#b45309;">${Math.round(p.score_global)} pts</b> <small>(Classement National)</small>` : ''}
        </div>

        <div style="margin-bottom:10px;">
          <b style="font-size:11px; color:#475569; text-transform:uppercase;">Infrastructures</b>
          <ul style="list-style:none; padding:0; margin:5px 0; font-size:12px;">
            <li>${hasDouche ? ' Douches' : ' Pas de douches'}</li>
            <li> ${nbVestiaires} vestiaires</li>
            <li>${isHandi ? ' Accès PMR' : ' Non accessible'}</li>
            ${nbTribunes > 0 ? `<li> ${nbTribunes} places tribunes</li>` : ''}
          </ul>
        </div>

        ${p.equip_url ? `
          <div style="border-top:1px solid #eee; padding-top:8px; text-align:center;">
            <a href="${p.equip_url}" target="_blank" style="color:#2563eb; text-decoration:none; font-size:12px; font-weight:bold;">
              <i class="fa-solid fa-circle-info"></i> Fiche équipement
            </a>
          </div>
        ` : ''}
      </div>
    `;

    marker.bindPopup(popupHtml).addTo(layer);
  });

  // Mise à jour du compteur
  const compteurEl = document.getElementById("compteur");
  if (compteurEl) {
    compteurEl.innerHTML = `<span class="count-number">${count}</span> lieux trouvés`;
  }
}

      // GESTION UI
      document.querySelectorAll('#perf-filters button').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('#perf-filters button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filterPerf = btn.dataset.perf;
          render();
        };
      });

      document.querySelectorAll('#filters-list button').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('#filters-list button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filterType = btn.dataset.filter;
          render();
        };
      });

      // Toggles Confort
      document.getElementById('toggleDouche').onclick = function() {
        filterDouche = !filterDouche;
        this.classList.toggle('active');
        render();
      };
      document.getElementById('toggleHandi').onclick = function() {
        filterHandi = !filterHandi;
        this.classList.toggle('active');
        render();
      };
      document.getElementById('toggleTribune').onclick = function() {
        filterTribune = !filterTribune;
        this.classList.toggle('active');
        render();
      };

      document.querySelector(".reset-btn").onclick = () => {
        location.reload();
      };
    };
  </script>
</body>
</html>
